<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARYA SOC Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background:#0b0f14; color:#e8eef5; }
    .card { background:#121923; padding:24px; border-radius:12px; }
    textarea { width:100%; min-height:130px; margin:12px 0; background:#080c11; color:#fff; border:1px solid #334155; padding:12px; }
    button { padding:10px 18px; cursor:pointer; }
    pre { white-space:pre-wrap; background:#080c11; padding:15px; border-radius:8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ARYA SOC Assistant</h1>
    <p>Defensive alert triage and risk-scoring demo.</p>
    <textarea id="message" placeholder="Example: 25 failed login attempts from one source IP"></textarea>
    <button onclick="analyze()">Analyze Alert</button>
    <pre id="result">Waiting for an alert...</pre>
  </div>

  <script>
    async function analyze() {
      const message = document.getElementById("message").value;
      const response = await fetch("/api/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message, source: "manual"})
      });
      document.getElementById("result").textContent =
        JSON.stringify(await response.json(), null, 2);
    }
  </script>
</body>
</html>
